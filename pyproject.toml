[project]
name = "swingbot"
version = "1.0.0"
description = "Uzun vadeli (swing) kripto sinyal ve islem botu"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:bot.*"]
